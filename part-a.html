    // א3 - נכון או לא נכון?
    console.log(5 == "5");           // ניחוש: true
    console.log(5 === "5");          // ניחוש: false
    console.log(0 == false);         // ניחוש: true
    console.log(0 === false);        // ניחוש: false
    console.log(null == undefined);  // ניחוש: true
    console.log(null === undefined); // ניחוש: false
    console.log(NaN === NaN);        // ניחוש: false (NaN לא שווה לאף ערך, גם לא לעצמו)
    console.log("a" === "a");        // ניחוש: true

    console.log(Boolean(0));         // false
    console.log(Boolean(""));        // false
    console.log(Boolean("0"));       // true - מחרוזת לא ריקה
    console.log(Boolean([]));        // true - מערך (גם ריק) הוא אובייקט
    console.log(Boolean(null));      // false
    console.log(Boolean(undefined)); // false
    console.log(Boolean("false"));   // true - מחרוזת לא ריקה
    console.log(Boolean(-1));        // true - כל מספר חוץ מ-0 ו-NaN
    // תמיד עדיף === כי הוא משווה גם טיפוס וגם ערך, בלי המרות מפתיעות.
